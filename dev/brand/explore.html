<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px -apple-system,system-ui;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.cell{padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.dark{background:#0E0E0F;color:#ccc}.row{display:flex;gap:18px;align-items:center}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FA"/><stop offset=".22" stop-color="#C5C9CF"/><stop offset=".38" stop-color="#FBFCFD"/><stop offset=".55" stop-color="#9DA2A9"/><stop offset=".72" stop-color="#E4E6EA"/><stop offset="1" stop-color="#AEB3BA"/></linearGradient>
<linearGradient id="matte" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A2D"/><stop offset="1" stop-color="#0F0F10"/></linearGradient>
</defs></svg>
<script>
const V = {
 A: (c, ch) => `<path d="M94.6 38.3A40 40 0 1 0 94.6 89.7" fill="none" stroke="${c}" stroke-width="17" stroke-linecap="butt"/><path d="M88 78 L103 50 L118 78" fill="none" stroke="${ch}" stroke-width="9" stroke-linejoin="miter" stroke-linecap="butt"/>`,
 B: (c, ch) => `<path d="M100 36 A42 42 0 1 0 100 92" fill="none" stroke="${c}" stroke-width="18"/><path d="M58 82 L80 52 L102 82" fill="none" stroke="${ch}" stroke-width="10" stroke-linejoin="miter"/>`,
 C: (c, ch) => `<circle cx="64" cy="64" r="44" fill="none" stroke="${c}" stroke-width="7"/><path d="M100.5 38.5A44 44 0 0 1 100.5 89.5" fill="none" stroke="${ch}" stroke-width="14"/><path d="M44 80 L64 44 L84 80" fill="none" stroke="${c}" stroke-width="12" stroke-linejoin="miter"/>`
};
let out='';
for (const k of 'ABC') {
 const svg=(c,ch,s)=>`<svg viewBox="0 0 128 128" width="${s}" height="${s}">${V[k](c,ch)}</svg>`;
 out += `<div class="cell"><b>${k}</b>${svg('url(#matte)','url(#silver)',140)}<div class="row">${svg('#111','#111',32)}${svg('#111','#111',24)}${svg('url(#matte)','url(#silver)',48)}</div></div>`;
}
for (const k of 'ABC') {
 const svg=(c,ch,s)=>`<svg viewBox="0 0 128 128" width="${s}" height="${s}">${V[k](c,ch)}</svg>`;
 out += `<div class="cell dark"><b>${k}</b>${svg('url(#silver)','#FFFFFF',140)}<div class="row">${svg('#E8E8EA','#E8E8EA',32)}${svg('#E8E8EA','#E8E8EA',24)}</div></div>`;
}
document.body.insertAdjacentHTML('beforeend', out);
</script></body></html>
